name: Build ProductiveOS Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductiveOS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Version, Date & Time
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            VER_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$VER_NAME" ]; then
              VER_NAME="1.1.0"
            fi
            RELEASE_TAG="v${VER_NAME}"
          fi

          BUILD_DATE=$(date -u +"%A, %B %d, %Y")
          BUILD_TIME=$(date -u +"%I:%M:%S %p UTC")
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)

          cat <<EOF > release_notes.md
          # ProductiveOS ${RELEASE_TAG}

          📅 **Release Date:** ${BUILD_DATE}  
          ⏰ **Release Time:** ${BUILD_TIME}  
          🔖 **Version:** \`${RELEASE_TAG}\`  
          🔗 **Commit:** [\`${SHORT_SHA}\`](https://github.com/kaelvossofficial-cloud/ProductiveOS/commit/${COMMIT_SHA})

          ---

          ### 🌟 What's New in v1.2.0

          - 🎛️ **Swipe Left for Minimalist Widget Gallery**:
            - **Screen Time Ring Widget**: Real-time circular arc displaying screen time and unlocks against mindful budget.
            - **Interactive Pomodoro Focus Engine**: 25m Focus, 5m Break, 15m Rest with Start/Pause/Reset controls, progress arc, and ambient audio flow integration.
            - **Most Used Apps Widget**: Dynamic horizontal usage bars showing your top apps by conscious attention consumed.
            - **Important Notifications Widget**: Live filtered notifications from Messages, WhatsApp, Telegram, Gmail, and Calendar with one-tap jump to app.
            - **Focus Graphs & Rhythm Widget**: 7-day sparkline bar trend and ProductiveOS Zen index.
            - **Third-Party Android App Widgets**: Host any Android widget (Weather, Spotify, Notes, Stocks) wrapped inside high-end OS theme containers.

          - 📊 **Swipe Right for Mindful Reports Dashboard**:
            - **Daily, Weekly, and Monthly Period Selector**: Effortless navigation between timeframes.
            - **Concentric Radial Ring Chart**: Multi-layer canvas rings mapping screen time percentage and unlock ratios.
            - **Screen Time Over Days**: 7-day vertical bar chart with dashed 4h mindful benchmark line.
            - **Time of Day Distribution**: Visual split between Morning (06:00–12:00), Afternoon (12:00–18:00), and Evening (18:00–24:00).
            - **Overview by ProductiveOS**: Zen Mindful score (0–100), average gap between unlocks, and screen-off rest hours.

          - 🔍 **Omni-Search with Browser Recommendations**:
            - Instant search suggestions: Google, YouTube, Wikipedia, DuckDuckGo recommendation pills.
            - Pressing **Enter** immediately searches Google in your default browser without pre-opening any Google app.

          - 🛡️ **Intentional 3-Second Hold-to-Open Gate (Impulse & Mis-Touch Protection)**:
            - Apps on Zen Home will not open on accidental tap; requires holding for 3 seconds.
            - Progressive countdown ring with tactile tick feedback. Configurable (1s, 2s, 3s or instant tap) in Settings.

          - 🎨 **Plain Sleek Thin Colors Themes**:
            - New editorial palettes: **Pale Sage** (\`#EAEFE9\`), **Tokyo Mist** (\`#E9EEF3\`), **Ochre Sand** (\`#F5EFE6\`), and **Midnight Navy** (\`#0B101B\`).
            - High-contrast typography and ultra-thin \`0.75dp\` borders based on the UI/UX Pro Max standard.

          - ⚡ **Retained Micro-OS Utilities**:
            - Quantum Clip Vault, Focus Anchor ambient generator, Micro-Log second-brain capture, Burner Notes 24h ephemeral scratchpad, and PathCheck impulse gate.

          ---

          ### 📲 Direct Installation
          Download **\`app-debug.apk\`** below to install directly on your Android phone.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Updating release notes and APK asset..."
            gh release edit "$RELEASE_TAG" --title "ProductiveOS ${RELEASE_TAG}" --notes-file release_notes.md
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            echo "Creating new GitHub Release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "ProductiveOS ${RELEASE_TAG}" \
              --notes-file release_notes.md
          fi
