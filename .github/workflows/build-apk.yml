name: Build ProductiveOS Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace > build.log 2>&1 || {
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit 1
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductiveOS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Version, Date & Time
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            VER_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$VER_NAME" ]; then
              VER_NAME="1.6.0"
            fi
            RELEASE_TAG="v${VER_NAME}"
          fi

          BUILD_DATE=$(date -u +"%A, %B %d, %Y")
          BUILD_TIME=$(date -u +"%I:%M:%S %p UTC")
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)

          cat <<EOF > release_notes.md
          # ProductiveOS ${RELEASE_TAG}

          📅 **Release Date:** ${BUILD_DATE}  
          ⏰ **Release Time:** ${BUILD_TIME}  
          🔖 **Version:** \`${RELEASE_TAG}\`  
          🔗 **Commit:** [\`${SHORT_SHA}\`](https://github.com/kaelvossofficial-cloud/ProductiveOS/commit/${COMMIT_SHA})

          ---

          ### 🌟 What's New in v1.6.0 (Onboarding Ritual, All-in-One Permissions, Harmonized Icons & System Sync)

          - 🧭 **Seamless Onboarding Tutorial & All-in-One Permissions Interface**:
            - Added an intentional multi-step onboarding tutorial on first launch introducing the ProductiveOS philosophy.
            - **All-in-One Permissions Hub**: Request Default Home Launcher, Screen Time & Usage Access, Notification Access, and Google Calendar sync in one unified step with live status badges.
            - **Zen Gestures Guide**: Visual reference cards for quick access to drawer, reports, widget gallery, 3s mindful hold, and double-tap to lock.

          - 🎨 **Harmonized Monochrome Theme Icons & Google Squircle Shapes**:
            - App icons dynamically tint to harmonize with the active OS theme (Warm Stone, Slate Gray, Pure OLED Black).
            - Precision inner scaling ensures icons fit organically inside Google geometric shapes (Cookie, Flower, Clover, Sunny, Soft Triangle, Squircle, Pebble) without clipping.
            - Added **Icon Color Mode** toggle in Settings to switch between Harmonized and Original App Colors anytime.

          - 📐 **Centered Floating Safe Zone (Zero Overlap)**:
            - Re-anchored home screen floating icon constellation to the safe central viewport.
            - Constrained drift physics guarantee zero collision or overlap with clock, telemetry, or bottom search dock.

          - 📜 **Editorial List as App Drawer Default**:
            - Set the clean Editorial List mode as the default drawer experience with sleek typography and shaped icons.
            - Retained instant toggle to 4-column animated grid mode with edge scale physics.

          - 📅 **Real-Time Google Sync Widgets (Calendar, Tasks & Keep)**:
            - **Google Calendar**: Real-time agenda queries for today's events with formatted start times.
            - **Google Tasks & Google Keep**: 1-tap direct integration links embedded directly into the daily task card.

          - ⚙️ **Icon Customization & Size Adjuster**:
            - Added an interactive Icon Scale slider (70% - 135%) in Launcher Settings.

          - ⚡ **Performance & Lag Elimination (Buttery 120Hz)**:
            - Implemented an LRU bitmap cache (\`AppIconBitmapCache\`) for app drawables, eliminating IPC latency and frame drops.
            - Optimized interactive background grid to cut draw call overhead by ~55%.
            - Switched tilt sensors to UI rate, preventing thread saturation.

          - 🛡️ **Retained Features from Prior Versions**:
            - Quick actions & direct WhatsApp / SMS messaging from the home screen.
            - Interactive background dot/crosshair lattice grid.
            - Micro-OS Utilities (Quantum Clip, Focus Anchor, Micro-Log, Burner Notes).
            - Mindful reports dashboard, widget gallery, and Pomodoro focus tracker.

          ---

          ### 📲 Direct Installation
          Download **\`app-debug.apk\`** below to install directly on your Android phone.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Updating release notes and APK asset..."
            gh release edit "$RELEASE_TAG" --title "ProductiveOS ${RELEASE_TAG}" --notes-file release_notes.md
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            echo "Creating new GitHub Release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "ProductiveOS ${RELEASE_TAG}" \
              --notes-file release_notes.md
          fi
