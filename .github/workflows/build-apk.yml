name: Build ProductiveOS Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductiveOS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Version, Date & Time
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            VER_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$VER_NAME" ]; then
              VER_NAME="1.1.0"
            fi
            RELEASE_TAG="v${VER_NAME}"
          fi

          BUILD_DATE=$(date -u +"%A, %B %d, %Y")
          BUILD_TIME=$(date -u +"%I:%M:%S %p UTC")
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)

          cat <<EOF > release_notes.md
          # ProductiveOS ${RELEASE_TAG}

          📅 **Release Date:** ${BUILD_DATE}  
          ⏰ **Release Time:** ${BUILD_TIME}  
          🔖 **Version:** \`${RELEASE_TAG}\`  
          🔗 **Commit:** [\`${SHORT_SHA}\`](https://github.com/kaelvossofficial-cloud/ProductiveOS/commit/${COMMIT_SHA})

          ---

          ### 🌟 What's New in v1.5.0 (Magical Glow, Floating Google Shapes & Quick Actions)

          - 🌸 **Floating Google-Shaped Icons & Real-Time Gravity Tilt Physics**:
            - App icons on the Home Screen can now float in iconic Google-themed geometric shapes: **Cookie, Flower, Clover, Sunny, Soft Triangle, Squircle, and Pebble**.
            - Integrated real-time hardware accelerometer & gravity sensor physics (`rememberTilt`): tilting or holding your phone upside down applies a smooth organic parallax tilt and floating momentum to all on-screen elements.
            - Organic harmonic bobbing animation for icons on the home screen.

          - ✨ **Magical Radial Glowing Halo & Launch Bloom**:
            - Holding any app or pressing empty wallpaper triggers an expansive, luminous halo glow around your thumb tip (`Modifier.holdGlow`).
            - Reaching full hold completion bursts into a radial launch bloom transition before opening the application.

          - ⚡ **Productive Quick Action Capsules & Direct In-Launcher Reply**:
            - Holding down on an app icon surfaces an instant, sleek action capsule:
              - **WhatsApp / Telegram**: Instant direct chat shortcuts to your favorite VIP contacts without searching through the app.
              - **Phone / SMS**: 1-tap call & message shortcuts to favorite contacts.
              - **System Apps**: Quick actions for Camera (Photo/Video), Clock (Set Timer), Calendar (New Event), and Email.
              - **Live Notification Stream & Inline Reply**: View pending notifications from that app and type/send replies directly from the home screen using `RemoteInput` without opening the app!
            - Manage your VIP Favorite Contacts easily in Launcher Settings.

          - 🪟 **Plain Sleek Minimalist Capsules**:
            - Stripped away artificial borders, excessive strokes, and AI-like container artifacts in favor of clean, architectural surfaces with subtle tinted backdrops.

          - 📜 **Animated App Drawer Grid Mode with Edge Scale & Sink Physics**:
            - Added an animated 4-column icon grid mode in the App Drawer (`LazyVerticalGrid`).
            - Physics-driven scroll transforms: icons smoothly scale and sink as they roll into and out of the viewport edges.
            - Easily toggle between classic Editorial List and Organic Grid views right from the search header or Settings.

          - 🚀 **Buttery-Smooth Upward Velocity Pull & Seamless Scrubber**:
            - High-refresh rate gesture handling for pulling up the App Drawer with realistic finger momentum and spring snap.
            - Spring-damped wave physics on the right-edge alphabetical scrubber.
            - Empty screen long-press ritual with expanding glow to open Launcher Settings.

          - 🛡️ **Retained Features from v1.4.0 & Prior**:
            - Interactive background dot/crosshair lattice grid.
            - Micro-OS Utilities (Quantum Clip, Focus Anchor, Micro-Log, Burner Notes, PathCheck).
            - Mindful reports dashboard, widget gallery, and Pomodoro focus tracker.

          ---

          ### 📲 Direct Installation
          Download **\`app-debug.apk\`** below to install directly on your Android phone.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Updating release notes and APK asset..."
            gh release edit "$RELEASE_TAG" --title "ProductiveOS ${RELEASE_TAG}" --notes-file release_notes.md
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            echo "Creating new GitHub Release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "ProductiveOS ${RELEASE_TAG}" \
              --notes-file release_notes.md
          fi
