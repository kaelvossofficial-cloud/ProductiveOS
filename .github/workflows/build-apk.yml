name: Build ProductiveOS Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductiveOS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Version, Date & Time
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            VER_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$VER_NAME" ]; then
              VER_NAME="1.1.0"
            fi
            RELEASE_TAG="v${VER_NAME}"
          fi

          BUILD_DATE=$(date -u +"%A, %B %d, %Y")
          BUILD_TIME=$(date -u +"%I:%M:%S %p UTC")
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)

          cat <<EOF > release_notes.md
          # ProductiveOS ${RELEASE_TAG}

          📅 **Release Date:** ${BUILD_DATE}  
          ⏰ **Release Time:** ${BUILD_TIME}  
          🔖 **Version:** \`${RELEASE_TAG}\`  
          🔗 **Commit:** [\`${SHORT_SHA}\`](https://github.com/kaelvossofficial-cloud/ProductiveOS/commit/${COMMIT_SHA})

          ---

          ### 🌟 What's New in v1.4.0 (Senior UI/UX Choreography & Tactile Upgrade)

          - 🕸️ **Interactive Kinetic Background Grid Canvas (`InteractiveGridCanvas`)**:
            - Hardware-accelerated geometric dot & precision crosshair (`+`) matrix behind the Home Screen and Search Drawer.
            - **Magnetic Touch Well**: Grid points near your finger displace radially with spring physics and brighten dynamically.
            - **Hold-to-Open Resonance Ring**: Holding an app broadcasts an expanding concentric wave across the background lattice.

          - ⏳ **Asymmetric "Long-Touch Pause" Liquid Fill Ritual**:
            - Replaced small spinner with a **Full-Row Liquid Clip-Path Progress Sweep** (`0% -> 100%` width) and glowing meniscus edge.
            - **Asymmetric Enter/Exit Timing**: Deliberate linear progression during hold with rhythmic 600ms haptic ticks; snappy `180ms` custom `--ease-out` (`CubicBezierEasing(0.23, 1, 0.32, 1)`) bounce-back on early release.
            - **Peripheral Focus Dimming**: Non-held apps smoothly dim to `32%` opacity while holding an app so your attention stays anchored.

          - 🌊 **Gaussian Sine-Wave Right-Edge Sidebar (`WaveSidebarScrubber`)**:
            - Available on **both** the Zen Home Screen and Search Drawer.
            - Scrubbing vertically along the right edge bends adjacent letters (`A–Z`) outward in a smooth Gaussian bell curve (`46dp` crest) with dynamic font scaling and a floating Double-Bezel squircle preview badge.
            - Releasing on any letter from the Home Screen immediately jumps into the Search Drawer filtered to that letter.

          - 🚀 **Origin-Aware Scale-95 Transitions & Waterfall Stagger**:
            - Screen transitions now combine custom iOS/Linear-grade drawer curves (`CubicBezierEasing(0.32, 0.72, 0, 1)`) with `scaleIn(0.95f -> 1f)`.
            - Search drawer app rows cascade in with a `28ms` per-item waterfall reveal (`translationY` + `alpha`) without blocking immediate touch input.

          - 🛡️ **Double-Bezel ("Doppelrand") Hardware Enclosures (`DoubleBezelSquircle`)**:
            - Upgraded the Music Capsule, Telemetry Pill, Bottom Micro-OS Dock, Omni-Search bar, and Dashboard Widget Cards to nested Outer Shell + Inner Core squircle enclosures with specular inner borders.

          - 📊 **Retained v1.2 Features**:
            - Mindful Reports Dashboard (Daily/Weekly/Monthly, concentric radial ring charts, hourly usage breakdown).
            - Widget Gallery with Pomodoro timer, Screen Time gauge, and 3rd-party widget hosting.
            - Omni-Search with instant Google browser search recommendations.
            - Intentional 3-second hold-to-open gate.
            - Plain Sleek Thin Colors (Pale Sage, Tokyo Mist, Ochre Sand, Midnight Navy).
            - Micro-OS Utilities (Quantum Clips, Focus Anchor, Micro-Log, Burner Notes).

          - 🛡️ **Intentional 3-Second Hold-to-Open Gate (Impulse & Mis-Touch Protection)**:
            - Apps on Zen Home will not open on accidental tap; requires holding for 3 seconds.
            - Progressive countdown ring with tactile tick feedback. Configurable (1s, 2s, 3s or instant tap) in Settings.

          - 🎨 **Plain Sleek Thin Colors Themes**:
            - New editorial palettes: **Pale Sage** (\`#EAEFE9\`), **Tokyo Mist** (\`#E9EEF3\`), **Ochre Sand** (\`#F5EFE6\`), and **Midnight Navy** (\`#0B101B\`).
            - High-contrast typography and ultra-thin \`0.75dp\` borders based on the UI/UX Pro Max standard.

          - ⚡ **Retained Micro-OS Utilities**:
            - Quantum Clip Vault, Focus Anchor ambient generator, Micro-Log second-brain capture, Burner Notes 24h ephemeral scratchpad, and PathCheck impulse gate.

          ---

          ### 📲 Direct Installation
          Download **\`app-debug.apk\`** below to install directly on your Android phone.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Updating release notes and APK asset..."
            gh release edit "$RELEASE_TAG" --title "ProductiveOS ${RELEASE_TAG}" --notes-file release_notes.md
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            echo "Creating new GitHub Release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "ProductiveOS ${RELEASE_TAG}" \
              --notes-file release_notes.md
          fi
