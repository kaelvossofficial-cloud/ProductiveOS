name: Build ProductiveOS Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Expose Failure Log via Release
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 250 build.log > failure_snippet.txt
          gh release delete "ci-debug" --yes || true
          gh release create "ci-debug" build.log failure_snippet.txt \
            --title "CI Debug Failure" \
            --notes-file failure_snippet.txt

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductiveOS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Version, Date & Time
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            VER_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$VER_NAME" ]; then
              VER_NAME="1.7.0"
            fi
            RELEASE_TAG="v${VER_NAME}"
          fi

          BUILD_DATE=$(date -u +"%A, %B %d, %Y")
          BUILD_TIME=$(date -u +"%I:%M:%S %p UTC")
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)

          cat <<EOF > release_notes.md
          # ProductiveOS ${RELEASE_TAG}

          📅 **Release Date:** ${BUILD_DATE}  
          ⏰ **Release Time:** ${BUILD_TIME}  
          🔖 **Version:** \`${RELEASE_TAG}\`  
          🔗 **Commit:** [\`${SHORT_SHA}\`](https://github.com/kaelvossofficial-cloud/ProductiveOS/commit/${COMMIT_SHA})

          ---

          ### 🌟 What's New in v1.7.0 (Smart Monochrome Desaturation, Guided Permissions Workflow, Replay Ritual & Google System Sync)

          - 🎨 **Smart Monochrome Desaturation & Adaptive Icon Pipeline**:
            - Legacy non-adaptive bitmap icons no longer turn into solid flat silhouette blocks; they now pass through an intelligent high-contrast monochrome ColorMatrix (\`setToSaturation(0f)\`) with clean contrast curves and a subtle translucent contour border.
            - Adaptive icons automatically receive full monochrome palette harmonization (\`monochromeTint\`) with precision inner scaling (\`0.82f - 0.88f\`) that perfectly hugs Google geometric container shapes (Cookie, Flower, Clover, Sunny, Soft Triangle, Squircle, Pebble).
            - Settings allows instant toggling between **Harmonized** and **Original App Colors**.

          - 🧭 **Guided Sequential Permissions Flow in Onboarding**:
            - Added an interactive guide banner in the Onboarding Permissions step that cycles sequentially through missing permissions (Default Launcher → Screen Time & Usage → Notification Access → Google Calendar Sync).
            - Real-time confirmation badges show instant checkmarks as permissions are granted, concluding with an all-clear confirmation.

          - 🔄 **Replay Onboarding Tutorial & Permissions Hub in Settings**:
            - Added a dedicated card in Settings under **Vault & System** allowing users to replay the entire onboarding tutorial, refresh their gesture orientation, and audit all required permissions at any time.

          - 📅 **Google System Integration & Action Shortcuts**:
            - **Google Calendar**: Real-time agenda queries for upcoming events with automatic sync status banner prompting permission grant if not yet configured.
            - **Google Tasks & Google Keep**: Direct 1-tap creation intents (\`createNewGoogleTask\`, \`createNewGoogleKeepNote\`) to immediately draft tasks and notes without launcher lag.

          - ⚡ **120Hz Ultra-Smooth Fluid Physics & Zero Overlap Layout**:
            - Constrained floating icon constellation to the safe center viewport with zero collision across status clock, system telemetry, and search dock.
            - Optimized \`InteractiveGridCanvas\` dot matrix rendering (~55% fewer draw operations) and UI-rate sensor processing.
            - High-performance LRU drawable cache (\`AppIconBitmapCache\`) eliminating IPC frame stutter.

          - 🛡️ **Retained Signature Features**:
            - Quick actions & direct WhatsApp / SMS messaging from the home screen.
            - Mindful reports dashboard, widget gallery, and Pomodoro focus tracker.
            - Double-tap to lock screen & 3-second mindful hold app launch delay.

          ---

          ### 📲 Direct Installation
          Download **\`app-debug.apk\`** below to install directly on your Android phone.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Updating release notes and APK asset..."
            gh release edit "$RELEASE_TAG" --title "ProductiveOS ${RELEASE_TAG}" --notes-file release_notes.md
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            echo "Creating new GitHub Release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "ProductiveOS ${RELEASE_TAG}" \
              --notes-file release_notes.md
          fi
